[project]
name = "faithqs"
version = "0.1.0"
description = "Pipeline that collects publicly available questions about Latter-day Saint doctrine, history, and practice into a labeled corpus."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "protego>=0.3",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "py7zr>=0.22",
    "duckdb>=1.0",
    "datasets>=2.19",
    "huggingface-hub>=0.23",
]

[project.scripts]
faithqs = "faithqs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faithqs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
